<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiTS · 40 Student Lap Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #1a1e24;
            font-family: 'Segoe UI', 'Inter', Roboto, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            color: #eef2f5;
        }

        .tracker {
            max-width: 1400px;
            width: 100%;
            background: #0f1318;
            border-radius: 2rem;
            padding: 1.8rem 1.8rem 2.2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,255,255,0.05);
            border: 1px solid #2e3740;
        }

        .setup-panel {
            background: #171f27;
            border: 1px solid #2d3845;
            border-radius: 1.4rem;
            padding: 1.4rem 1.6rem;
            margin-bottom: 1.6rem;
        }

        .setup-panel h2 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #c9ddf5;
            margin-bottom: 1rem;
            letter-spacing: 0.3px;
        }

        .setup-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            align-items: flex-end;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .field-group label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #8ea4bb;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .field-group input {
            background: #0d141c;
            border: 1px solid #35414f;
            color: #e8f2ff;
            padding: 0.55rem 0.9rem;
            border-radius: 0.7rem;
            font-size: 0.95rem;
            width: 120px;
            font-variant-numeric: tabular-nums;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }

        .field-group input:focus {
            outline: none;
            border-color: #4a8cc7;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), 0 0 0 3px rgba(74,140,199,0.25);
        }

        .names-area {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            flex: 1;
            min-width: 260px;
        }

        .names-area label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #8ea4bb;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .names-area textarea {
            background: #0d141c;
            border: 1px solid #35414f;
            color: #e8f2ff;
            padding: 0.6rem 0.9rem;
            border-radius: 0.7rem;
            font-size: 0.95rem;
            font-family: inherit;
            resize: vertical;
            min-height: 5.5rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
            line-height: 1.5;
        }

        .names-area textarea:focus {
            outline: none;
            border-color: #4a8cc7;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), 0 0 0 3px rgba(74,140,199,0.25);
        }

        .names-area .hint {
            font-size: 0.75rem;
            color: #647a8e;
            margin-top: 0.1rem;
        }

        .btn-apply {
            background: #2a4a63;
            border: 1px solid #3f6a8a;
            color: #e8f6ff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.65rem 1.8rem;
            border-radius: 0.8rem;
            cursor: pointer;
            letter-spacing: 0.4px;
            transition: 0.12s;
            box-shadow: 0 4px 0 #0e1a22, 0 4px 10px black;
            align-self: flex-end;
        }

        .btn-apply:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0e1a22, 0 6px 10px black;
        }

        .btn-apply:hover { background: #345a78; }

        .sort-toggle {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            align-self: flex-end;
            padding-bottom: 0.65rem;
        }

        .sort-toggle label {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #b4c7dc;
            cursor: pointer;
            user-select: none;
        }

        .sort-toggle input[type="checkbox"] {
            width: 1.1rem;
            height: 1.1rem;
            accent-color: #4a8cc7;
            cursor: pointer;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.4rem;
            gap: 1.2rem;
        }

        .title-block h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #d0e2ff, #a0c0f0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }
        .title-block .sub { font-size: 0.85rem; color: #7f8c9a; margin-top: 0.2rem; }

        .master-controls {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            background: #1c232b;
            padding: 0.6rem 1.6rem;
            border-radius: 3.5rem;
            border: 1px solid #2d3845;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), 0 4px 8px rgba(0,0,0,0.4);
            flex-wrap: wrap;
        }

        .target-info {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            font-size: 0.95rem;
            color: #b4c7dc;
        }
        .target-info .num {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffd966;
            font-variant-numeric: tabular-nums;
        }

        .master-timer {
            display: flex;
            align-items: baseline;
            font-size: 3.4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            background: #0b0f14;
            padding: 0.05rem 1.3rem 0.05rem 1.6rem;
            border-radius: 3rem;
            border: 2px solid #35414f;
            box-shadow: inset 0 2px 8px black, 0 0 20px rgba(74,140,199,0.15);
            line-height: 1.1;
        }
        .master-timer .minutes, .master-timer .seconds {
            color: #aad0ff;
            text-shadow: 0 0 18px rgba(74,140,199,0.5);
        }
        .master-timer .colon { color: #4e6580; margin: 0 0.1rem; }

        .start-btn {
            background: #1e2d3b;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.7rem 1.8rem;
            border-radius: 3rem;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.15s;
            box-shadow: 0 6px 0 #0b1116, 0 6px 12px black;
            border: 1px solid #3d5062;
        }
        .start-btn:active { transform: translateY(6px); box-shadow: 0 1px 0 #0b1116, 0 8px 12px black; }
        .start-btn.running { background: #2c4b62; box-shadow: 0 4px 0 #16222b, 0 6px 12px black; transform: translateY(2px); }

        .reset-btn {
            background: #262f38;
            border: 1px solid #3f4f5e;
            color: #cad8e8;
            padding: 0.6rem 1.1rem;
            border-radius: 2.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 4px 0 #12171c, 0 4px 8px black;
        }
        .reset-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #12171c, 0 6px 10px black; }

        .results-btn {
            background: #1f4d3a;
            border: 1px solid #2f7a5e;
            color: #d4f7e7;
            padding: 0.6rem 1.3rem;
            border-radius: 2.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 4px 0 #0c211a, 0 4px 8px black;
            letter-spacing: 0.3px;
        }
        .results-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #0c211a, 0 6px 10px black; }
        .results-btn:hover { background: #286a50; }

        .export-btn {
            background: #1f4d3a;
            border: 1px solid #2f7a5e;
            color: #d4f7e7;
            padding: 0.6rem 1.3rem;
            border-radius: 2.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 4px 0 #0c211a, 0 4px 8px black;
            letter-spacing: 0.3px;
        }
        .export-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #0c211a, 0 6px 10px black; }
        .export-btn:hover { background: #286a50; }

        .font-controls {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: #1c232b;
            padding: 0.35rem 0.7rem;
            border-radius: 2rem;
            border: 1px solid #2d3845;
        }

        .font-controls .font-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #8ea4bb;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-right: 0.1rem;
        }

        .font-btn {
            background: #2e3a45;
            border: none;
            color: #f0f6ff;
            font-size: 1.1rem;
            font-weight: 700;
            width: 1.9rem;
            height: 1.9rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.12s;
            box-shadow: 0 3px 0 #0b0e11;
            line-height: 1;
            user-select: none;
        }
        .font-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #0b0e11; }
        .font-btn:hover { background: #3e4d5c; }
        .font-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: 0 3px 0 #0b0e11; }

        .font-size-display {
            font-size: 0.95rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #aad0ff;
            min-width: 3.2rem;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 0.85rem;
        }

        .card {
            background: #171f27;
            border-radius: 1.2rem;
            padding: 0.8rem 0.25rem 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 0 #0a0e11, 0 8px 16px rgba(0,0,0,0.6);
            border: 2px solid #29343f;
            transition: all 0.15s;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            position: relative;
            touch-action: manipulation;
        }
        .card:active { transform: translateY(5px); box-shadow: 0 3px 0 #0a0e11, 0 8px 16px black; }

        .card .name {
            font-size: var(--name-size, 1.45rem);
            font-weight: 800;
            color: #d5e8ff;
            background: #1d2933;
            padding: 0.35rem 0.5rem;
            border-radius: 1rem;
            letter-spacing: 0.2px;
            margin-bottom: 0.4rem;
            border: 1px solid #2e3d4b;
            box-shadow: inset 0 1px 3px black;
            max-width: 97%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
            line-height: 1.2;
        }

        .card .time {
            font-size: 1.3rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #d7e9ff;
            text-shadow: 0 2px 6px rgba(0,180,255,0.3);
            letter-spacing: 0.4px;
            margin: 0.15rem 0 0.3rem;
        }

        .card .lap-counter {
            font-size: 0.9rem;
            font-weight: 700;
            color: #92b8e0;
            background: #0d141c;
            padding: 0.15rem 0.85rem;
            border-radius: 2rem;
            border: 1px solid #2e4255;
            box-shadow: inset 0 1px 4px black;
            margin-top: 0.1rem;
        }

        /* ── Top-right badge (status icon) ── */
        .card .status-icon {
            position: absolute;
            top: -0.9rem;
            right: -0.9rem;
            font-size: 2.1rem;
            line-height: 1;
            width: 2.6rem;
            height: 2.6rem;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            border: 2.5px solid #0f1318;
            z-index: 2;
            pointer-events: none;
        }

        /* ── Top-left "⋯" menu button (iPad / touch friendly) ── */
        .card .menu-btn {
            position: absolute;
            top: -0.75rem;
            left: -0.75rem;
            width: 1.9rem;
            height: 1.9rem;
            border-radius: 50%;
            background: #2a3642;
            border: 2px solid #0f1318;
            color: #c9ddf5;
            font-size: 1.05rem;
            font-weight: 800;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            box-shadow: 0 3px 8px rgba(0,0,0,0.7);
            transition: 0.12s;
            padding: 0;
            font-family: inherit;
        }
        .card .menu-btn:hover { background: #3a4d5f; color: #ffffff; }
        .card .menu-btn:active { transform: scale(0.9); }

        /* ── Status colours ── */
        .card.running {
            background: #14301f;
            border-color: #2e9e4f;
            box-shadow: 0 8px 0 #081a0e, 0 8px 16px black, 0 0 14px rgba(46,158,79,0.4);
        }
        .card.running .name { color: #b6f0c9; border-color: #2e9e4f; background: #1d4a2c; }
        .card.running .lap-counter { background: #1f5a34; color: #c4f0d4; border-color: #2e9e4f; }
        .card.running .time { color: #c9ffdb; }

        .card.final-lap {
            background: #3a2a12 !important;
            border-color: #f2a33c !important;
            box-shadow: 0 8px 0 #1a1206, 0 8px 16px black, 0 0 18px rgba(242,163,60,0.55) !important;
        }
        .card.final-lap .name { color: #ffd9a0 !important; border-color: #f2a33c !important; background: #4a3416 !important; }
        .card.final-lap .lap-counter { background: #6b4a1e !important; color: #ffe7c2 !important; border-color: #f2a33c !important; }
        .card.final-lap .time { color: #ffdca8 !important; }
        .card.final-lap .status-icon { display: flex; background: #f2a33c; color: #3a2a12; }

        .card.completed {
            background: #12283a !important;
            border-color: #2f8fd4 !important;
            box-shadow: 0 8px 0 #08141e, 0 8px 16px black, 0 0 20px rgba(47,143,212,0.55) !important;
        }
        .card.completed .name { color: #c4e4ff !important; border-color: #2f8fd4 !important; background: #1a3a52 !important; }
        .card.completed .lap-counter { background: #1e568a !important; color: #dff0ff !important; border-color: #2f8fd4 !important; }
        .card.completed .time { color: #cfeaff !important; }
        .card.completed .status-icon { display: flex; background: #2f8fd4; color: #ffffff; }

        .card.absent {
            background: #1e1e1e !important;
            border-color: #4a4a4a !important;
            box-shadow: 0 8px 0 #0a0a0a, 0 8px 16px black !important;
            opacity: 0.7;
        }
        .card.absent .name {
            color: #8a8a8a !important;
            border-color: #3a3a3a !important;
            background: #262626 !important;
            text-decoration: line-through;
            text-decoration-thickness: 2.5px;
        }
        .card.absent .lap-counter { background: #1a1a1a !important; color: #6a6a6a !important; border-color: #3a3a3a !important; }
        .card.absent .time { color: #6a6a6a !important; }
        .card.absent .status-icon { display: flex; background: #4a4a4a; color: #d0d0d0; }

        .card.unwell {
            background: #0e2c28 !important;
            border-color: #17b8a6 !important;
            box-shadow: 0 8px 0 #061512, 0 8px 16px black, 0 0 16px rgba(23,184,166,0.5) !important;
        }
        .card.unwell .name { color: #b0f0e8 !important; border-color: #17b8a6 !important; background: #154a42 !important; }
        .card.unwell .lap-counter { background: #155a50 !important; color: #d0f5ef !important; border-color: #17b8a6 !important; }
        .card.unwell .time { color: #c9f5ef !important; }
        .card.unwell .status-icon { display: flex; background: #17b8a6; color: #06221e; }

        .context-menu {
            position: fixed;
            background: #1c232b;
            border: 1px solid #3d5062;
            border-radius: 0.9rem;
            box-shadow: 0 12px 28px rgba(0,0,0,0.85);
            padding: 0.4rem;
            z-index: 1000;
            display: none;
            min-width: 220px;
        }
        .context-menu.open { display: block; }
        .context-menu .cm-header {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #647a8e;
            padding: 0.4rem 0.8rem 0.3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .context-menu button {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            width: 100%;
            background: transparent;
            border: none;
            color: #d5e8ff;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.6rem 0.8rem;
            border-radius: 0.6rem;
            cursor: pointer;
            text-align: left;
            transition: 0.1s;
        }
        .context-menu button:hover { background: #2a3642; }
        .context-menu button.active { background: #2a4a63; }
        .context-menu .cm-icon {
            font-size: 1.15rem;
            width: 1.6rem;
            text-align: center;
        }
        .context-menu .cm-divider {
            height: 1px;
            background: #2d3845;
            margin: 0.3rem 0.5rem;
        }

        @media (max-width: 1200px) { .grid { grid-template-columns: repeat(7, 1fr); } }
        @media (max-width: 1050px) { .grid { grid-template-columns: repeat(6, 1fr); } }
        @media (max-width: 900px)  { .grid { grid-template-columns: repeat(5, 1fr); } }
        @media (max-width: 750px)  { .grid { grid-template-columns: repeat(4, 1fr); } .master-timer { font-size: 2.6rem; } .card .status-icon { font-size: 1.8rem; width: 2.2rem; height: 2.2rem; top: -0.75rem; right: -0.75rem; } .card .menu-btn { width: 1.6rem; height: 1.6rem; font-size: 0.9rem; top: -0.6rem; left: -0.6rem; } }
        @media (max-width: 600px)  { .grid { grid-template-columns: repeat(3, 1fr); gap: 0.6rem; } .tracker { padding: 1.2rem; } .card .time { font-size: 1.1rem; } .master-timer { font-size: 2.2rem; } .card .status-icon { font-size: 1.5rem; width: 1.9rem; height: 1.9rem; top: -0.65rem; right: -0.65rem; } .card .menu-btn { width: 1.4rem; height: 1.4rem; font-size: 0.75rem; } }
        @media (max-width: 450px)  { .grid { grid-template-columns: repeat(2, 1fr); } .master-timer { font-size: 1.9rem; } }

        /* When long-press fires, prevent text selection highlight */
        .card.no-select, .card.no-select * { -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body>
    <div class="tracker">

        <div class="setup-panel" id="setupPanel">
            <h2>⚙️ Setup — Students &amp; Lap Target</h2>
            <div class="setup-row">
                <div class="field-group">
                    <label for="numStudents">Number of Students</label>
                    <input type="number" id="numStudents" min="1" max="60" value="40">
                </div>
                <div class="field-group">
                    <label for="targetLaps">Target Laps</label>
                    <input type="number" id="targetLaps" min="1" max="99" value="5">
                </div>
                <div class="names-area">
                    <label for="namesInput">Student Names (one per line, or comma-separated)</label>
                    <textarea id="namesInput" placeholder="Alice&#10;Bob&#10;Charlie&#10;…"></textarea>
                    <span class="hint">Tap <strong>⋯</strong> on a card, or <strong>long-press</strong> a card (iPad) / <strong>right-click</strong> (desktop) to mark Absent/Unwell.</span>
                </div>
                <div class="sort-toggle">
                    <label for="sortAlpha">
                        <input type="checkbox" id="sortAlpha">
                        Sort A → Z
                    </label>
                </div>
                <button class="btn-apply" id="applySetupBtn">✅ Apply Setup</button>
            </div>
        </div>

        <div class="header">
            <div class="title-block">
                <h1>RiTS · Lap Tracker</h1>
                <div class="sub" id="subtitle">40 students · target 5 laps</div>
            </div>

            <div class="master-controls">
                <div class="target-info">
                    Target: <span class="num" id="targetDisplay">5</span>
                </div>
                <div class="master-timer">
                    <span class="minutes" id="masterMin">00</span>
                    <span class="colon">:</span>
                    <span class="seconds" id="masterSec">00</span>
                </div>
                <button class="start-btn" id="startStopBtn">START</button>
                <button class="reset-btn" id="resetBtn">RESET</button>
                <button class="results-btn" id="resultsBtn">📋 VIEW RESULTS</button>
                <button class="export-btn" id="exportBtn">📊 EXPORT EXCEL</button>

                <div class="font-controls">
                    <span class="font-label">Name</span>
                    <button class="font-btn" id="fontDecBtn" title="Decrease name font size">−</button>
                    <span class="font-size-display" id="fontSizeDisplay">1.45</span>
                    <button class="font-btn" id="fontIncBtn" title="Increase name font size">+</button>
                </div>
            </div>
        </div>

        <div class="grid" id="studentGrid"></div>
    </div>

    <div class="context-menu" id="contextMenu">
        <div class="cm-header" id="cmHeader">Student</div>
        <button data-reason=""><span class="cm-icon">✅</span> Clear marking (active)</button>
        <div class="cm-divider"></div>
        <button data-reason="absent"><span class="cm-icon">✖</span> Mark as Absent</button>
        <button data-reason="unwell"><span class="cm-icon">🤒</span> Mark as Unwell</button>
    </div>

    <script>
    (function () {
        'use strict';

        var MAX_STUDENTS = 60;
        var FONT_MIN = 0.70, FONT_MAX = 2.20, FONT_STEP = 0.10;
        var nameFontSize = 1.45;

        var LONG_PRESS_MS = 500;
        var MOVE_TOLERANCE_PX = 10;

        var lapTarget       = 5;
        var studentCount    = 40;
        var studentNames    = [];
        var globalSeconds   = 0;
        var timerInterval   = null;
        var isRunning       = false;
        var students        = [];
        var contextTarget   = -1;

        var grid             = document.getElementById('studentGrid');
        var masterMin        = document.getElementById('masterMin');
        var masterSec        = document.getElementById('masterSec');
        var startStopBtn     = document.getElementById('startStopBtn');
        var resetBtn         = document.getElementById('resetBtn');
        var targetDisplay    = document.getElementById('targetDisplay');
        var subtitle         = document.getElementById('subtitle');
        var numStudentsInput = document.getElementById('numStudents');
        var targetLapsInput  = document.getElementById('targetLaps');
        var namesInput       = document.getElementById('namesInput');
        var applySetupBtn    = document.getElementById('applySetupBtn');
        var resultsBtn       = document.getElementById('resultsBtn');
        var exportBtn        = document.getElementById('exportBtn');
        var sortAlphaCheckbox = document.getElementById('sortAlpha');
        var fontDecBtn       = document.getElementById('fontDecBtn');
        var fontIncBtn       = document.getElementById('fontIncBtn');
        var fontSizeDisplay  = document.getElementById('fontSizeDisplay');
        var contextMenu      = document.getElementById('contextMenu');
        var cmHeader         = document.getElementById('cmHeader');

        // ---------- helpers ----------
        function pad2(n) { return n < 10 ? '0' + n : '' + n; }

        function formatTime(seconds) {
            var m = Math.floor(seconds / 60);
            var s = Math.floor(seconds % 60);
            return { minutes: pad2(m), seconds: pad2(s), full: pad2(m) + ':' + pad2(s) };
        }

        function updateMasterTimerDisplay() {
            var t = formatTime(globalSeconds);
            masterMin.textContent = t.minutes;
            masterSec.textContent = t.seconds;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function parseNames(raw, count, sortAlpha) {
            var parts = raw.split(/[\n,]+/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
            var names = [];
            for (var i = 0; i < count; i++) {
                names.push(i < parts.length ? parts[i] : 'Student ' + (i + 1));
            }
            if (sortAlpha) {
                names.sort(function (a, b) { return a.localeCompare(b, undefined, { sensitivity: 'base' }); });
            }
            return names;
        }

        function applyNameFontSize() {
            document.documentElement.style.setProperty('--name-size', nameFontSize.toFixed(2) + 'rem');
            fontSizeDisplay.textContent = nameFontSize.toFixed(2);
            fontDecBtn.disabled = nameFontSize <= FONT_MIN + 0.001;
            fontIncBtn.disabled = nameFontSize >= FONT_MAX - 0.001;
        }

        function changeFontSize(delta) {
            var next = Math.round((nameFontSize + delta) * 100) / 100;
            if (next < FONT_MIN) next = FONT_MIN;
            if (next > FONT_MAX) next = FONT_MAX;
            if (next === nameFontSize) return;
            nameFontSize = next;
            applyNameFontSize();
        }

        // ---------- build grid ----------
        function buildGrid() {
            grid.innerHTML = '';
            students = [];

            for (var i = 0; i < studentCount; i++) {
                students.push({
                    name: studentNames[i],
                    laps: 0,
                    lastLapTime: 0,
                    finished: false,
                    finishTime: null,
                    reason: null
                });

                (function (idx) {
                    var card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.index = idx;

                    // "⋯" menu button (touch / iPad friendly)
                    var menuBtn = document.createElement('button');
                    menuBtn.className = 'menu-btn';
                    menuBtn.type = 'button';
                    menuBtn.textContent = '⋯';
                    menuBtn.title = 'Mark Absent / Unwell';
                    menuBtn.setAttribute('aria-label', 'Open marking menu for ' + studentNames[idx]);
                    menuBtn.addEventListener('click', function (e) {
                        e.stopPropagation();
                        e.preventDefault();
                        var rect = card.getBoundingClientRect();
                        openContextMenu(idx, rect.left + rect.width / 2, rect.top + rect.height / 2);
                    });
                    // Also stop pointer events bubbling so long-press timer doesn't arm
                    menuBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });

                    var statusIcon = document.createElement('div');
                    statusIcon.className = 'status-icon';

                    var nameEl = document.createElement('div');
                    nameEl.className = 'name';
                    nameEl.textContent = studentNames[idx];
                    nameEl.title = studentNames[idx] + '  (tap ⋯ or long-press to mark)';

                    var timeEl = document.createElement('div');
                    timeEl.className = 'time';
                    timeEl.textContent = '00:00';

                    var lapEl = document.createElement('div');
                    lapEl.className = 'lap-counter';
                    lapEl.textContent = '0';

                    card.appendChild(menuBtn);
                    card.appendChild(statusIcon);
                    card.appendChild(nameEl);
                    card.appendChild(timeEl);
                    card.appendChild(lapEl);

                    // ---- Long-press detection state ----
                    var pressTimer = null;
                    var longPressFired = false;
                    var startX = 0, startY = 0;

                    function cancelPress() {
                        if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
                    }

                    card.addEventListener('pointerdown', function (e) {
                        // Ignore right-click (handled by contextmenu) and non-primary buttons
                        if (e.button !== undefined && e.button !== 0) return;

                        longPressFired = false;
                        startX = e.clientX;
                        startY = e.clientY;

                        cancelPress();
                        pressTimer = setTimeout(function () {
                            longPressFired = true;
                            card.classList.add('no-select');
                            openContextMenu(idx, startX, startY);
                        }, LONG_PRESS_MS);
                    });

                    card.addEventListener('pointermove', function (e) {
                        if (!pressTimer) return;
                        var dx = Math.abs(e.clientX - startX);
                        var dy = Math.abs(e.clientY - startY);
                        if (dx > MOVE_TOLERANCE_PX || dy > MOVE_TOLERANCE_PX) {
                            cancelPress();
                        }
                    });

                    card.addEventListener('pointerup', function () {
                        cancelPress();
                        card.classList.remove('no-select');
                    });

                    card.addEventListener('pointercancel', function () {
                        cancelPress();
                        card.classList.remove('no-select');
                    });

                    card.addEventListener('pointerleave', function () {
                        cancelPress();
                    });

                    // ---- Normal tap = record lap ----
                    card.addEventListener('click', function (e) {
                        if (longPressFired) {
                            // Long-press already opened the menu — suppress this click
                            longPressFired = false;
                            e.preventDefault();
                            e.stopPropagation();
                            return;
                        }
                        var s = students[idx];
                        if (s.reason === 'absent') return;
                        if (s.finished) return;
                        s.laps += 1;
                        s.lastLapTime = globalSeconds;
                        if (lapTarget > 0 && s.laps >= lapTarget) {
                            s.finished = true;
                            s.finishTime = globalSeconds;
                        }
                        updateCardDisplay(idx);
                    });

                    // ---- Right-click (desktop / trackpad) ----
                    card.addEventListener('contextmenu', function (e) {
                        e.preventDefault();
                        openContextMenu(idx, e.clientX, e.clientY);
                    });

                    grid.appendChild(card);
                })(i);
            }

            if (isRunning) applyRunningStateToAll();
            else refreshAllCards();
            updateSubtitle();
        }

        // ---------- context menu ----------
        function openContextMenu(index, x, y) {
            contextTarget = index;
            var s = students[index];
            if (!s) return;

            cmHeader.textContent = s.name;

            var btns = contextMenu.querySelectorAll('button');
            for (var i = 0; i < btns.length; i++) {
                var btn = btns[i];
                var r = btn.dataset.reason || null;
                if (r === s.reason) btn.classList.add('active');
                else btn.classList.remove('active');
            }

            contextMenu.classList.add('open');
            var rect = contextMenu.getBoundingClientRect();
            var vw = window.innerWidth, vh = window.innerHeight;
            var left = x - rect.width / 2;
            var top  = y + 12;
            if (left < 8) left = 8;
            if (left + rect.width > vw - 8) left = vw - rect.width - 8;
            if (top + rect.height > vh - 8) top = y - rect.height - 12;
            if (top < 8) top = 8;
            contextMenu.style.left = left + 'px';
            contextMenu.style.top  = top + 'px';
        }

        function closeContextMenu() {
            contextMenu.classList.remove('open');
            contextTarget = -1;
            // Clear any leftover no-select
            var cards = grid.children;
            for (var i = 0; i < cards.length; i++) cards[i].classList.remove('no-select');
        }

        function setReason(index, reason) {
            var s = students[index];
            if (!s) return;
            s.reason = reason || null;

            if (s.reason === 'absent') {
                s.laps = 0;
                s.lastLapTime = 0;
                s.finished = false;
                s.finishTime = null;
            }

            updateCardDisplay(index);
            closeContextMenu();
        }

        // ---------- card display ----------
        function updateCardDisplay(index) {
            var card = grid.children[index];
            if (!card) return;
            var student = students[index];
            if (!student) return;

            var timeEl = card.querySelector('.time');
            var lapEl  = card.querySelector('.lap-counter');
            var iconEl = card.querySelector('.status-icon');

            if (timeEl) timeEl.textContent = formatTime(student.lastLapTime).full;
            if (lapEl)  lapEl.textContent  = student.laps;

            card.classList.remove('final-lap', 'completed', 'running', 'absent', 'unwell');
            if (iconEl) iconEl.textContent = '';

            if (student.reason === 'absent') {
                card.classList.add('absent');
                if (iconEl) iconEl.textContent = '✖';
                return;
            }
            if (student.finished) {
                card.classList.add('completed');
                if (iconEl) iconEl.textContent = '✓';
                return;
            }
            if (lapTarget > 0 && student.laps === lapTarget - 1) {
                card.classList.add('final-lap');
                if (iconEl) iconEl.textContent = '🏁';
                return;
            }
            if (student.reason === 'unwell') {
                card.classList.add('unwell');
                if (iconEl) iconEl.textContent = '🤒';
                return;
            }
            if (isRunning) {
                card.classList.add('running');
            }
        }

        function refreshAllCards() {
            for (var i = 0; i < students.length; i++) updateCardDisplay(i);
        }

        function applyRunningStateToAll() {
            for (var i = 0; i < students.length; i++) updateCardDisplay(i);
        }

        function updateSubtitle() {
            subtitle.textContent =
                studentCount + ' student' + (studentCount !== 1 ? 's' : '') +
                ' · target ' + lapTarget + ' lap' + (lapTarget !== 1 ? 's' : '');
        }

        // ---------- timer ----------
        function tick() { globalSeconds++; updateMasterTimerDisplay(); }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            timerInterval = setInterval(tick, 1000);
            startStopBtn.textContent = 'STOP';
            startStopBtn.classList.add('running');
            applyRunningStateToAll();
        }

        function stopTimer() {
            if (!isRunning) return;
            isRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;
            startStopBtn.textContent = 'START';
            startStopBtn.classList.remove('running');
            refreshAllCards();
        }

        function resetAll() {
            stopTimer();
            globalSeconds = 0;
            updateMasterTimerDisplay();
            for (var i = 0; i < students.length; i++) {
                students[i].laps = 0;
                students[i].lastLapTime = 0;
                students[i].finished = false;
                students[i].finishTime = null;
                students[i].reason = null;
                updateCardDisplay(i);
            }
        }

        // ---------- classification ----------
        function classify(student) {
            if (student.reason === 'absent') {
                return { key: 'absent', label: 'Absent', cls: 'status-absent', icon: '✖' };
            }
            if (student.finished) {
                return { key: 'completed', label: 'Completed', cls: 'status-completed', icon: '✓' };
            }
            if (student.reason === 'unwell') {
                return { key: 'unwell', label: 'Present — Unwell', cls: 'status-unwell', icon: '🤒' };
            }
            if (student.laps > 0) {
                return { key: 'dnf', label: 'Attempted — DNF', cls: 'status-dnf', icon: '🏁' };
            }
            return { key: 'nostart', label: 'Present — Did Not Start', cls: 'status-nostart', icon: '—' };
        }

        function getSortedStudents(mode) {
            var indexed = students.map(function (s, i) {
                return {
                    name: s.name, laps: s.laps, lastLapTime: s.lastLapTime,
                    finished: s.finished, finishTime: s.finishTime, reason: s.reason,
                    _orig: i
                };
            });

            if (mode === 'alpha') {
                return indexed.sort(function (a, b) {
                    return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
                });
            }
            if (mode === 'input') {
                return indexed.sort(function (a, b) { return a._orig - b._orig; });
            }

            var order = { completed: 0, dnf: 1, unwell: 2, nostart: 3, absent: 4 };
            return indexed.sort(function (a, b) {
                var ca = classify(a), cb = classify(b);
                if (order[ca.key] !== order[cb.key]) return order[ca.key] - order[cb.key];
                if (ca.key === 'completed' && cb.key === 'completed') {
                    return (a.finishTime == null ? Infinity : a.finishTime) -
                           (b.finishTime == null ? Infinity : b.finishTime);
                }
                if (b.laps !== a.laps) return b.laps - a.laps;
                return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
            });
        }

        function getRank(student) {
            if (!student.finished) return '—';
            var count = 0;
            for (var i = 0; i < students.length; i++) {
                var x = students[i];
                if (x.finished && (x.finishTime == null ? Infinity : x.finishTime) <= (student.finishTime == null ? Infinity : student.finishTime)) {
                    count++;
                }
            }
            return '#' + count;
        }

        // ---------- results page ----------
        function openResultsPage() {
            var counts = { completed: 0, dnf: 0, unwell: 0, absent: 0, nostart: 0 };
            for (var i = 0; i < students.length; i++) counts[classify(students[i]).key]++;

            var masterTime = formatTime(globalSeconds).full;
            var exportDate = new Date().toLocaleString();

            function buildRows(mode) {
                var sorted = getSortedStudents(mode);
                var html = '';
                for (var i = 0; i < sorted.length; i++) {
                    var s = sorted[i];
                    var c = classify(s);
                    var rankCell = '—';
                    if (mode === 'ranking') rankCell = getRank(s);
                    else if (mode === 'input') rankCell = '#' + (i + 1);

                    var finishTime = s.finishTime !== null ? formatTime(s.finishTime).full : '—';
                    var lastLap = s.reason === 'absent' ? '—' : formatTime(s.lastLapTime).full;

                    html += '<tr>' +
                        '<td class="rank">' + rankCell + '</td>' +
                        '<td class="name-cell">' + escapeHtml(s.name) + '</td>' +
                        '<td class="num">' + s.laps + '</td>' +
                        '<td class="num">' + lastLap + '</td>' +
                        '<td class="' + c.cls + '">' + c.label + ' ' + c.icon + '</td>' +
                        '<td class="num">' + finishTime + '</td>' +
                        '</tr>';
                }
                return html;
            }

            var rowsRanking = buildRows('ranking');
            var rowsAlpha   = buildRows('alpha');
            var rowsInput   = buildRows('input');

            var resultsCss = [
                '* { box-sizing: border-box; margin: 0; padding: 0; }',
                'body { background: #1a1e24; font-family: "Segoe UI", "Inter", Roboto, system-ui, sans-serif; color: #eef2f5; padding: 2rem 1rem; min-height: 100vh; }',
                '.container { max-width: 1150px; margin: 0 auto; background: #0f1318; border-radius: 1.5rem; padding: 2rem 2.2rem 2.4rem; box-shadow: 0 20px 40px rgba(0,0,0,0.7); border: 1px solid #2e3740; }',
                'h1 { font-size: 1.9rem; font-weight: 700; background: linear-gradient(135deg,#d0e2ff,#a0c0f0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 0.3rem; }',
                '.meta { color: #7f8c9a; font-size: 0.9rem; margin-bottom: 1.4rem; display: flex; flex-wrap: wrap; gap: 1.2rem; }',
                '.meta span { display: inline-flex; align-items: center; gap: 0.35rem; }',
                '.meta strong { color: #c9ddf5; font-weight: 600; }',
                '.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.8rem; margin-bottom: 1.6rem; }',
                '.summary-card { background: #171f27; border: 1px solid #2d3845; border-radius: 1rem; padding: 0.9rem 0.7rem; text-align: center; }',
                '.summary-card .label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: #8ea4bb; margin-bottom: 0.3rem; }',
                '.summary-card .value { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; color: #aad0ff; }',
                '.summary-card.completed { border-color: #2f8fd4; } .summary-card.completed .value { color: #6fc4ff; }',
                '.summary-card.dnf { border-color: #f2a33c; } .summary-card.dnf .value { color: #f2a33c; }',
                '.summary-card.unwell { border-color: #17b8a6; } .summary-card.unwell .value { color: #17b8a6; }',
                '.summary-card.absent { border-color: #6a6a6a; } .summary-card.absent .value { color: #9a9a9a; }',
                '.summary-card.nostart { border-color: #5a6a7a; } .summary-card.nostart .value { color: #8aa4bc; }',
                '.sort-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; background: #171f27; padding: 0.4rem; border-radius: 1rem; border: 1px solid #2d3845; width: fit-content; }',
                '.sort-tab { background: transparent; border: none; color: #8ea4bb; font-size: 0.9rem; font-weight: 600; padding: 0.55rem 1.1rem; border-radius: 0.7rem; cursor: pointer; transition: 0.12s; letter-spacing: 0.3px; }',
                '.sort-tab:hover { background: #1e2830; color: #c9ddf5; }',
                '.sort-tab.active { background: #2a4a63; color: #e8f6ff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }',
                '.sort-note { font-size: 0.8rem; color: #647a8e; margin-bottom: 1rem; }',
                'table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.95rem; }',
                'thead th { background: #1c232b; color: #b4c7dc; font-weight: 600; font-size: 0.8rem; letter-spacing: 0.5px; text-transform: uppercase; padding: 0.85rem 0.8rem; text-align: left; border-bottom: 2px solid #2d3845; position: sticky; top: 0; }',
                'thead th:first-child { border-top-left-radius: 0.8rem; } thead th:last-child { border-top-right-radius: 0.8rem; }',
                'tbody td { padding: 0.7rem 0.8rem; border-bottom: 1px solid #1e2830; }',
                'tbody tr:hover td { background: #141c24; }',
                'td.rank { font-weight: 700; color: #ffd966; font-variant-numeric: tabular-nums; text-align: center; }',
                'td.name-cell { font-weight: 700; font-size: 1.05rem; color: #e6f0ff; }',
                'td.num { font-variant-numeric: tabular-nums; color: #c9ddf5; }',
                'td.status-completed { color: #6fc4ff; font-weight: 600; }',
                'td.status-dnf       { color: #f2a33c; font-weight: 600; }',
                'td.status-unwell    { color: #17b8a6; font-weight: 600; }',
                'td.status-absent    { color: #9a9a9a; font-weight: 600; }',
                'td.status-nostart   { color: #8aa4bc; font-weight: 600; }',
                '.footer { margin-top: 2rem; padding-top: 1.2rem; border-top: 1px solid #2d3845; color: #647a8e; font-size: 0.8rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem; }',
                '.no-print-btn { background: #2a4a63; border: 1px solid #3f6a8a; color: #e8f6ff; font-weight: 600; font-size: 0.9rem; padding: 0.6rem 1.4rem; border-radius: 0.7rem; cursor: pointer; letter-spacing: 0.4px; }',
                '.no-print-btn:hover { background: #345a78; }',
                '@media print { body { background: white; color: black; padding: 0; } .container { box-shadow: none; border: none; background: white; max-width: 100%; } h1 { color: #1a1e24; -webkit-text-fill-color: #1a1e24; } .meta, .meta strong { color: #555; } .summary-card { background: #f5f5f5; border-color: #ddd; } .summary-card .label { color: #666; } .summary-card .value { color: #1a1e24; } thead th { background: #eee; color: #333; border-bottom-color: #ccc; } tbody td { border-bottom-color: #eee; color: #222; } td.name-cell { color: #000; } td.num { color: #222; } td.rank { color: #a86b12; } .no-print-btn, .sort-tabs, .sort-note { display: none; } .footer { color: #666; border-top-color: #ccc; } }'
            ].join('\n');

            var resultsJs =
                'var rowsData = {' +
                    'ranking: ' + JSON.stringify(rowsRanking) + ',' +
                    'alpha: '   + JSON.stringify(rowsAlpha)   + ',' +
                    'input: '   + JSON.stringify(rowsInput)   +
                '};\n' +
                'var notes = {\n' +
                    'ranking: "Completed first (fastest), then DNF by laps, then unwell, then absent.",\n' +
                    'alpha: "Sorted alphabetically by name (A → Z, case-insensitive).",\n' +
                    'input: "Sorted in the original order the names were entered."\n' +
                '};\n' +
                'var tbody = document.getElementById("resultsBody");\n' +
                'var noteEl = document.getElementById("sortNote");\n' +
                'var tabs = document.querySelectorAll(".sort-tab");\n' +
                'function setSort(mode) {\n' +
                    'tbody.innerHTML = rowsData[mode];\n' +
                    'noteEl.textContent = notes[mode];\n' +
                    'for (var i = 0; i < tabs.length; i++) {\n' +
                        'tabs[i].classList.toggle("active", tabs[i].getAttribute("data-sort") === mode);\n' +
                    '}\n' +
                '}\n' +
                'for (var i = 0; i < tabs.length; i++) {\n' +
                    '(function(tab){ tab.addEventListener("click", function(){ setSort(tab.getAttribute("data-sort")); }); })(tabs[i]);\n' +
                '}\n';

            var resultsHtml =
                '<!DOCTYPE html>\n' +
                '<html lang="en">\n<head>\n' +
                '<meta charset="UTF-8">\n' +
                '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
                '<title>Lap Results · ' + escapeHtml(exportDate) + '</title>\n' +
                '<style>\n' + resultsCss + '\n</style>\n' +
                '</head>\n<body>\n' +
                '<div class="container">\n' +
                '  <h1>Lap Results</h1>\n' +
                '  <div class="meta">\n' +
                '    <span>📅 <strong>' + escapeHtml(exportDate) + '</strong></span>\n' +
                '    <span>⏱ Master timer: <strong>' + masterTime + '</strong></span>\n' +
                '    <span>🎯 Target: <strong>' + lapTarget + ' lap' + (lapTarget !== 1 ? 's' : '') + '</strong></span>\n' +
                '  </div>\n' +
                '  <div class="summary-grid">\n' +
                '    <div class="summary-card"><div class="label">Total</div><div class="value">' + students.length + '</div></div>\n' +
                '    <div class="summary-card completed"><div class="label">Completed</div><div class="value">' + counts.completed + '</div></div>\n' +
                '    <div class="summary-card dnf"><div class="label">Attempted — DNF</div><div class="value">' + counts.dnf + '</div></div>\n' +
                '    <div class="summary-card unwell"><div class="label">Present — Unwell</div><div class="value">' + counts.unwell + '</div></div>\n' +
                '    <div class="summary-card absent"><div class="label">Absent</div><div class="value">' + counts.absent + '</div></div>\n' +
                '    <div class="summary-card nostart"><div class="label">Present — No Start</div><div class="value">' + counts.nostart + '</div></div>\n' +
                '  </div>\n' +
                '  <div class="sort-tabs">\n' +
                '    <button class="sort-tab active" data-sort="ranking">🏆 Ranking (by time)</button>\n' +
                '    <button class="sort-tab" data-sort="alpha">🔤 Alphabetical (A→Z)</button>\n' +
                '    <button class="sort-tab" data-sort="input">📋 Input Order</button>\n' +
                '  </div>\n' +
                '  <div class="sort-note" id="sortNote">Completed first (fastest), then DNF by laps, then unwell, then absent.</div>\n' +
                '  <table>\n' +
                '    <thead><tr>' +
                '      <th style="width:60px;text-align:center">Rank</th>' +
                '      <th>Name</th>' +
                '      <th style="width:70px">Laps</th>' +
                '      <th style="width:120px">Last Lap</th>' +
                '      <th style="width:190px">Status</th>' +
                '      <th style="width:120px">Finish Time</th>' +
                '    </tr></thead>\n' +
                '    <tbody id="resultsBody">\n' + rowsRanking + '\n    </tbody>\n' +
                '  </table>\n' +
                '  <div class="footer">\n' +
                '    <span>RiTS · Multi Timing Solution</span>\n' +
                '    <button class="no-print-btn" onclick="window.print()">🖨 Print / Save PDF</button>\n' +
                '  </div>\n' +
                '</div>\n' +
                '<script>\n' + resultsJs + '<\/script>\n' +
                '</body>\n</html>';

            var blob = new Blob([resultsHtml], { type: 'text/html' });
            var url  = URL.createObjectURL(blob);
            var win  = window.open(url, '_blank');
            setTimeout(function () { URL.revokeObjectURL(url); }, 30000);

            if (!win) {
                alert('Pop-up blocked. Please allow pop-ups for this page to view results.');
            }
        }

        // ---------- export excel ----------
        function exportExcel() {
            var rows = [];
            rows.push(['Rank', 'Name', 'Laps Completed', 'Last Lap Time (MM:SS)', 'Status', 'Finish Time (MM:SS)']);

            var sorted = getSortedStudents('ranking');

            var rankCounter = 0;
            for (var i = 0; i < sorted.length; i++) {
                var s = sorted[i];
                var c = classify(s);
                var rankCell = '—';
                if (c.key === 'completed') {
                    rankCounter++;
                    rankCell = rankCounter;
                }

                rows.push([
                    rankCell,
                    s.name,
                    s.laps,
                    s.reason === 'absent' ? '—' : formatTime(s.lastLapTime).full,
                    c.label,
                    s.finishTime !== null ? formatTime(s.finishTime).full : '—'
                ]);
            }

            var counts = { completed: 0, dnf: 0, unwell: 0, absent: 0, nostart: 0 };
            for (var j = 0; j < students.length; j++) counts[classify(students[j]).key]++;

            rows.push([]);
            rows.push(['SUMMARY']);
            rows.push(['Total Students', students.length]);
            rows.push(['Completed', counts.completed]);
            rows.push(['Attempted — DNF', counts.dnf]);
            rows.push(['Present — Unwell', counts.unwell]);
            rows.push(['Absent', counts.absent]);
            rows.push(['Present — No Start', counts.nostart]);
            rows.push(['Target Laps', lapTarget]);
            rows.push(['Master Timer', formatTime(globalSeconds).full]);
            rows.push(['Export Date', new Date().toLocaleString()]);

            function escapeXml(str) {
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
            }

            var xml = '<?xml version="1.0"?>\n';
            xml += '<?mso-application progid="Excel.Sheet"?>\n';
            xml += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"\n';
            xml += ' xmlns:o="urn:schemas-microsoft-com:office:office"\n';
            xml += ' xmlns:x="urn:schemas-microsoft-com:office:excel"\n';
            xml += ' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n';
            xml += '<Styles>\n';
            xml += '  <Style ss:ID="header"><Font ss:Bold="1" ss:Color="#FFFFFF" ss:Size="12"/>';
            xml += '<Interior ss:Color="#2A4A63" ss:Pattern="Solid"/>';
            xml += '<Alignment ss:Horizontal="Center" ss:Vertical="Center"/></Style>\n';
            xml += '  <Style ss:ID="completed"><Interior ss:Color="#CFEAFF" ss:Pattern="Solid"/>';
            xml += '<Font ss:Bold="1" ss:Color="#1E568A"/></Style>\n';
            xml += '  <Style ss:ID="dnf"><Interior ss:Color="#FFE7C2" ss:Pattern="Solid"/>';
            xml += '<Font ss:Bold="1" ss:Color="#8A5A14"/></Style>\n';
            xml += '  <Style ss:ID="unwell"><Interior ss:Color="#D0F5EF" ss:Pattern="Solid"/>';
            xml += '<Font ss:Bold="1" ss:Color="#0E5A50"/></Style>\n';
            xml += '  <Style ss:ID="absent"><Interior ss:Color="#E8E8E8" ss:Pattern="Solid"/>';
            xml += '<Font ss:Bold="1" ss:Color="#5A5A5A"/></Style>\n';
            xml += '  <Style ss:ID="nostart"><Interior ss:Color="#E0E8F0" ss:Pattern="Solid"/>';
            xml += '<Font ss:Bold="1" ss:Color="#4A5A6A"/></Style>\n';
            xml += '  <Style ss:ID="summary"><Font ss:Bold="1" ss:Size="12" ss:Color="#1F4D3A"/>';
            xml += '<Interior ss:Color="#D4F7E7" ss:Pattern="Solid"/></Style>\n';
            xml += '</Styles>\n';
            xml += '<Worksheet ss:Name="Lap Results">\n<Table>\n';
            xml += '  <Column ss:Width="60"/>\n  <Column ss:Width="130"/>\n';
            xml += '  <Column ss:Width="90"/>\n  <Column ss:Width="120"/>\n';
            xml += '  <Column ss:Width="190"/>\n  <Column ss:Width="120"/>\n';

            for (var r = 0; r < rows.length; r++) {
                var row = rows[r];
                xml += '<Row>\n';
                for (var c = 0; c < row.length; c++) {
                    var val = (row[c] !== undefined && row[c] !== null) ? row[c] : '';
                    var styleId = '';

                    if (r === 0) styleId = 'header';
                    else if (row.length > 0 && row[0] === 'SUMMARY') styleId = 'summary';
                    else if (r > 0 && r < rows.length - 11) {
                        var statusVal = row[4];
                        if (statusVal === 'Completed')                    styleId = 'completed';
                        else if (statusVal === 'Attempted — DNF')         styleId = 'dnf';
                        else if (statusVal === 'Present — Unwell')        styleId = 'unwell';
                        else if (statusVal === 'Absent')                  styleId = 'absent';
                        else if (statusVal === 'Present — Did Not Start') styleId = 'nostart';
                    }

                    var styleAttr = styleId ? ' ss:StyleID="' + styleId + '"' : '';
                    var isNum = (c === 0 && val !== '—' && val !== '' && !isNaN(val));
                    var typeAttr = isNum ? ' ss:Type="Number"' : ' ss:Type="String"';
                    xml += '  <Cell' + styleAttr + '><Data' + typeAttr + '>' + escapeXml(val) + '</Data></Cell>\n';
                }
                xml += '</Row>\n';
            }

            xml += '</Table>\n</Worksheet>\n</Workbook>\n';

            var blob = new Blob([xml], { type: 'application/vnd.ms-excel' });
            var url  = URL.createObjectURL(blob);
            var a    = document.createElement('a');

            var now = new Date();
            var stamp = '' + now.getFullYear() + pad2(now.getMonth() + 1) + pad2(now.getDate()) +
                        '_' + pad2(now.getHours()) + pad2(now.getMinutes());

            a.href = url;
            a.download = 'lap_results_' + stamp + '.xls';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ---------- setup ----------
        function applySetup() {
            var newCount = parseInt(numStudentsInput.value, 10);
            if (isNaN(newCount) || newCount < 1) newCount = 1;
            if (newCount > MAX_STUDENTS) newCount = MAX_STUDENTS;
            numStudentsInput.value = newCount;
            studentCount = newCount;

            var newTarget = parseInt(targetLapsInput.value, 10);
            if (isNaN(newTarget) || newTarget < 1) newTarget = 1;
            if (newTarget > 99) newTarget = 99;
            targetLapsInput.value = newTarget;
            lapTarget = newTarget;

            var sortAlpha = sortAlphaCheckbox.checked;
            studentNames = parseNames(namesInput.value, studentCount, sortAlpha);
            if (sortAlpha) namesInput.value = studentNames.join('\n');

            stopTimer();
            globalSeconds = 0;
            updateMasterTimerDisplay();
            buildGrid();
            targetDisplay.textContent = lapTarget;
            updateSubtitle();
        }

        // ---------- events ----------
        function initEvents() {
            startStopBtn.addEventListener('click', function () {
                if (isRunning) stopTimer();
                else startTimer();
            });
            resetBtn.addEventListener('click', resetAll);
            applySetupBtn.addEventListener('click', applySetup);
            resultsBtn.addEventListener('click', openResultsPage);
            exportBtn.addEventListener('click', exportExcel);

            [numStudentsInput, targetLapsInput].forEach(function (inp) {
                inp.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') { e.preventDefault(); applySetup(); }
                });
            });

            fontDecBtn.addEventListener('click', function () { changeFontSize(-FONT_STEP); });
            fontIncBtn.addEventListener('click', function () { changeFontSize(FONT_STEP); });

            contextMenu.querySelectorAll('button').forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    if (contextTarget < 0) return;
                    var reason = btn.dataset.reason || null;
                    setReason(contextTarget, reason);
                });
            });

            document.addEventListener('click', function (e) {
                if (!contextMenu.contains(e.target)) closeContextMenu();
            });
            document.addEventListener('scroll', closeContextMenu, true);
            window.addEventListener('resize', closeContextMenu);
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeContextMenu();
            });
        }

        // ---------- init ----------
        function init() {
            var defaultNames = [];
            for (var i = 1; i <= 40; i++) defaultNames.push('Student ' + i);
            namesInput.value = defaultNames.join('\n');
            applyNameFontSize();
            applySetup();
            initEvents();
        }

        init();
    })();
    </script>
</body>
</html>
